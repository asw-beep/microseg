# CPU-trainable U-Net with the distance head enabled.
#
# Identical to `unet_cpu.yaml` in every other respect -- same splits, same
# preprocessing, same schedule -- so the two runs are a controlled comparison of
# one variable: how instances are seeded.
#
#   boundary seeding (unet_cpu)   a seed is an interior-dominant pixel, so two
#                                 nuclei separate only where the network
#                                 predicts a boundary band between them.
#   distance seeding (this)       a seed is a pixel near its own object's
#                                 centre, which survives even where the two
#                                 nuclei overlap and there is no band to find.
#
# Cost: one extra 1x1 conv (negligible), one EDT per sample (already computed by
# the dataset either way), and a distance term in the loss.  Set
# `postprocess.use_distance_seeds: false` to evaluate this same checkpoint with
# the boundary route instead -- that is the honest A/B, one model, two decoders.
name: unet_cpu_distance
output_dir: outputs
seed: 42

data:
  root: data/raw/stage1_train
  processed_root: data/processed
  val_fraction: 0.15
  test_fraction: 0.15
  split_seed: 42        # same partition as every other config
  tile_size: 256
  augment: true

preprocess:
  auto_invert: true
  hot_pixel_correction: true
  hot_pixel_threshold: 5.0
  illumination: morphological
  illumination_radius: 50
  denoise: median
  denoise_strength: 1.0
  contrast: clahe
  clahe_clip_limit: 2.0
  clahe_tile_grid: 8
  normalize: percentile
  percentile_low: 1.0
  percentile_high: 99.0

model:
  name: unet
  in_channels: 1
  out_channels: 3
  base_filters: 16
  depth: 4
  dropout: 0.1
  norm: batch
  bilinear_upsample: false
  distance_head: true

loss:
  ce_weight: 1.0
  dice_weight: 1.0
  class_weights: [1.0, 1.0, 3.0]
  # On par with the CE term once it converges; the term is masked to foreground,
  # so it is not diluted by the background that dominates the field.
  distance_weight: 1.0

train:
  epochs: 25
  batch_size: 8
  lr: 0.001
  weight_decay: 0.00001
  optimizer: adamw
  scheduler: cosine
  num_workers: 0
  device: cpu
  amp: false            # GradScaler is CUDA-only
  early_stopping_patience: 8
  grad_clip: 1.0
  log_every: 20
  seed: 42

postprocess:
  foreground_threshold: 0.5
  seed_threshold: 0.5
  use_distance_seeds: true
  distance_seed_threshold: 0.5
  min_object_area: 15
  min_seed_area: 4
  fill_holes: true
  peak_min_distance: 5

analysis:
  compute_texture: true
  glcm_distances: [1, 3]
  glcm_levels: 32
  exclude_border_objects: false
